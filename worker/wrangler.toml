name = "bonerio-vivo"
main = "bonerio-vivo.js"
compatibility_date = "2024-09-23"
account_id = "9dd627ce922f9e55caeae78fe18885ce"

[vars]
ROFEX_URL = "https://api.bull.xoms.com.ar"
ORIGINS = "https://boneriolocal.com.ar,https://www.boneriolocal.com.ar"
# Los secrets van por el panel de Cloudflare (Settings › Variables and Secrets) o por consola, no acá:
#   npx wrangler secret put ROFEX_USER
#   npx wrangler secret put ROFEX_PASS

# Conexión permanente con Primary (clase Feed): empuja los precios a /stream
[[durable_objects.bindings]]
name = "FEED"
class_name = "Feed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Feed"]
