name: "Acciones: dólar histórico"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ccl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CCL y oficial históricos
        run: python3 scripts/ccl_historico.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/acciones/ccl.json
            git commit -m "acciones: dólar histórico $(date -u +%F)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
