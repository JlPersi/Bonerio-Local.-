name: Dolar inicial (temporal)
# Corre una vez scripts/save_dolar.py en esta rama para crear data/dolar.json (A3500 desde 2023 y la foto del cierre). Se borra después.
on:
  push:
    branches: [claude/gracious-gates-xki27a]
    paths: [".github/workflows/dolar-inicial.yml"]
permissions:
  contents: write
jobs:
  dolar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/save_dolar.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/dolar.json
            git commit -m "dolar.json inicial: A3500 desde 2023 y cierre de data912"
            git push
          fi
