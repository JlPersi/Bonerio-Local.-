name: "Acciones: logos"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/logos_acciones.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/logos data/logos.json
            git commit -m "acciones: logos $(date -u +%F)"
            git pull --rebase -q origin main && git push
          fi
