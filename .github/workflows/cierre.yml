name: Guardar cierre diario
on:
  schedule:
    # 17:30 y 18:30 hora Argentina (20:30 y 21:30 UTC), lunes a viernes; el segundo es respaldo (es idempotente)
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/save_close.py
      - name: Volumen del día
        if: always()
        run: python3 scripts/save_volume.py
      - name: Indices BCRA (CER, TAMAR, A3500)
        if: always()
        run: python3 scripts/save_indices.py
      - name: Dólar (A3500 desde 2023 y MEP y CCL de data912)
        if: always()
        run: python3 scripts/save_dolar.py
      - name: Riesgo país (ArgentinaDatos)
        if: always()
        run: python3 scripts/save_riesgo.py
      - name: Acciones (cierre del día, métricas y ratios)
        if: always()
        continue-on-error: true
        run: python3 scripts/save_acciones.py && python3 scripts/metricas_acciones.py && python3 scripts/ratios_acciones.py
      - name: Commit
        if: always()
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data
            git commit -m "cierre $(date -u +%F)"
            git push
          fi
