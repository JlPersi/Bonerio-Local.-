name: Guardar cierre diario
on:
  schedule:
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/save_close.py
      - name: Indices BCRA (CER, TAMAR, A3500)
        if: always()
        run: python3 scripts/save_indices.py
      - name: Commit
        if: always()
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/closes.json data/closes_ars.json data/indices.json
            git commit -m "cierre $(date -u +%F)"
            git push
          fi
