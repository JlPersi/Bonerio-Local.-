name: Tasas cortas
on:
  schedule:
    # cada 10 minutos de 10 a 18 hora Argentina (la foto de la rueda por Primary; desde las 17:07, ya cerrada la rueda, también el cierre de A3)
    # y 18:33 (lo que A3 y el BCRA publiquen tarde), lunes a viernes. Minutos impares a propósito: GitHub saltea más las corridas en punto.
    # Cada corrida tarda 5 a 8 minutos; con concurrency, si una se demora la siguiente espera en vez de pisarla
    - cron: "7,17,27,37,47,57 13-20 * * 1-5"
    - cron: "33 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: tasas
jobs:
  tasas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyRofex
      - run: python3 scripts/save_tasas.py
        env:
          ROFEX_USER: ${{ secrets.ROFEX_USER }}
          ROFEX_PASS: ${{ secrets.ROFEX_PASS }}
          ROFEX_URL: ${{ secrets.ROFEX_URL }}
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data
            git commit -m "tasas $(date -u +%F)"
            git pull --rebase -q origin main && git push
          fi
