name: Tasas cortas
on:
  schedule:
    # GitHub larga las corridas programadas con horas de atraso (o no las larga), así que no se usan para la foto cada 10 minutos:
    # una sola corrida queda prendida toda la rueda y saca la foto cada 10 minutos (ver el paso «Rueda»). Estos horarios solo la arrancan
    # si la cadena se cortó; si ya hay una corriendo, esperan en la fila y la siguiente de la cadena las reemplaza.
    - cron: "37 12 * * 1-5"
    - cron: "7 15 * * 1-5"
    - cron: "33 21 * * 1-5"
  workflow_dispatch:
    inputs:
      cadena:
        description: "La relanzó la corrida anterior (no saca foto si está fuera de la rueda)"
        default: ""
permissions:
  contents: write
  actions: write
concurrency: tasas
jobs:
  tasas:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyRofex
      - name: Rueda
        # Foto cada 10 minutos de 10 a 20 hora Argentina, lunes a viernes: los futuros por Primary hasta su cierre de las 15, la caución
        # de BYMA hasta las 17 y después lo que A3 y el BCRA publican al cierre (el A3500 del día sale entre las 18 y las 20).
        # Fuera de ese horario espera dormida hasta la próxima rueda. Antes de las 6 horas que permite GitHub por corrida, se relanza sola
        # (workflow_dispatch con el GITHUB_TOKEN sí arranca otra corrida), así la cadena no depende de los horarios programados.
        env:
          ROFEX_USER: ${{ secrets.ROFEX_USER }}
          ROFEX_PASS: ${{ secrets.ROFEX_PASS }}
          ROFEX_URL: ${{ secrets.ROFEX_URL }}
          GH_TOKEN: ${{ github.token }}
          CADENA: ${{ inputs.cadena }}
        run: |
          git config user.name "cierre-bot"
          git config user.email "bot@users.noreply.github.com"
          fin=$(( $(date +%s) + 320 * 60 ))
          ar() { TZ=America/Argentina/Buenos_Aires date "$@"; }
          rueda() { [ "$(ar +%u)" -le 5 ] && [ "$(ar +%H%M)" -ge 1000 ] && [ "$(ar +%H%M)" -le 2000 ]; }
          bonos() { [ "$(ar +%u)" -le 5 ] && [ "$(ar +%H%M)" -ge 1030 ] && [ "$(ar +%H%M)" -le 1705 ]; }  # el intradiario de los bonos (data912): cada 3 minutos, se sube con cada foto
          foto() {
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            if bonos; then python3 scripts/save_intra_bonos.py || echo "save_intra_bonos falló"; fi
            python3 scripts/save_intra_bonos.py --copiar || true
            python3 scripts/save_tasas.py || echo "save_tasas falló"
            [ "$(ar +%H%M)" -ge 1730 ] && { python3 scripts/save_dolar.py || echo "save_dolar falló"; }  # el A3500 del día apenas lo publica el BCRA (el cierre diario llega tarde)
            if [ -n "$(git status --porcelain data)" ]; then
              git add data && git commit -q -m "tasas $(date -u +%F)" || true
              for k in 1 2 3 4; do
                if git pull -q --rebase origin main; then git push -q && break; else git rebase --abort 2>/dev/null; git reset -q --hard origin/main; break; fi  # choque con el cierre diario: la próxima foto lo vuelve a sacar
                sleep $(( 5 * k ))
              done
            fi
          }
          rueda || [ -n "$CADENA" ] || foto  # la que arranca fuera de la rueda (la de las 18:33 o una a mano) igual saca su foto; la de la cadena, no
          while :; do
            if rueda; then
              t0=$(date +%s); foto; espera=$(( 600 - $(date +%s) + t0 )); [ $espera -lt 30 ] && espera=30
            else
              # hasta las 10 del próximo día hábil
              prox=$(ar -d "$(ar +%F) 10:00" +%s); [ "$(ar +%H%M)" -ge 1000 ] && prox=$(ar -d "$(ar +%F) 10:00 tomorrow" +%s)
              while [ "$(ar -d @$prox +%u)" -gt 5 ]; do prox=$(( prox + 86400 )); done
              espera=$(( prox - $(date +%s) ))
            fi
            if [ $(( $(date +%s) + espera )) -ge $fin ]; then
              resto=$(( fin - $(date +%s) )); [ $resto -gt 0 ] && ! rueda && sleep $resto
              gh workflow run tasas.yml --ref main -f cadena=1 && echo "relanzada" || echo "no se pudo relanzar"
              break
            fi
            hasta=$(( $(date +%s) + espera ))
            while :; do  # la espera, de a 3 minutos: en el horario de los bonos, una foto de sus precios en cada tramo (queda fuera del repo hasta la próxima foto)
              r=$(( hasta - $(date +%s) )); [ $r -le 0 ] && break
              [ $r -gt 180 ] && r=180; sleep $r
              if [ $(date +%s) -lt $(( hasta - 20 )) ] && bonos; then python3 scripts/save_intra_bonos.py >/dev/null || true; fi
            done
          done
