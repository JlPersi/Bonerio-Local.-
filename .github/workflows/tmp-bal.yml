name: tmp balances (debug)
on:
  push:
    branches: [claude/project-thread-9wlmpw]
    paths: [".github/workflows/tmp-bal.yml", "scripts/tmp/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tmp/probe_balances.py
      - name: Commit
        if: always()
        run: |
          git config user.name "tmp-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A tmp_cnv && git commit -qm "tmp: salida del sondeo [skip ci]" && git push || true
