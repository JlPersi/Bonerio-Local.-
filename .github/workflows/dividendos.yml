name: "Acciones: dividendos"
on:
  schedule:
    - cron: "30 23 * * 5"  # los viernes, después del histórico
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dividendos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yfinance
      - name: Dividendos de Yahoo
        run: python3 scripts/dividendos_acciones.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data
            git commit -m "acciones: dividendos $(date -u +%F)"
            git pull --rebase -q origin main && git push
          fi
