name: Worker en vivo
# Publica worker/ en Cloudflare cada vez que cambia. Necesita el secret CLOUDFLARE_API_TOKEN
# (Cloudflare › My Profile › API Tokens › Create Token › plantilla "Edit Cloudflare Workers").
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        if: env.CF != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: worker
        run: npx --yes wrangler@3.114.0 deploy
      - name: Sin token
        if: env.CF == ''
        run: echo "Falta el secret CLOUDFLARE_API_TOKEN; el Worker no se publicó."
