name: "ONs: completar historia (BYMA)"
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Cantidad máxima de especies (vacío: todas)"
        required: false
permissions:
  contents: write
jobs:
  hist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Historia de ONs y provinciales en dólares
        run: python3 scripts/ons_hist.py ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data
            git commit -m "ons: historia BYMA $(date -u +%F)"
            git pull --rebase -q origin main && git push
          fi
