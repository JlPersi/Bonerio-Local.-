name: tmp rofex (debug)
on:
  push:
    branches: [claude/project-thread-9wlmpw]
    paths: [scripts/save_tasas.py, .github/workflows/tmp-rofex.yml]
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyRofex
      - run: python3 scripts/save_tasas.py 2>&1 | tee tasas_log.txt
        env:
          ROFEX_USER: ${{ secrets.ROFEX_USER }}
          ROFEX_PASS: ${{ secrets.ROFEX_PASS }}
          ROFEX_URL: ${{ secrets.ROFEX_URL }}
      - run: |
          git config user.name tmp-bot; git config user.email bot@users.noreply.github.com
          mkdir -p tmp_out; mv tasas_log.txt tmp_out/
          git add -f tmp_out data/tasas.json; git commit -m "tmp: salida del sondeo [skip ci]" && git push
