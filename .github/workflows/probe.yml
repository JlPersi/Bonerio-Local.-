name: probe
on:
  push:
    branches: [claude/project-thread-9wlmpw]
    paths: [scripts/save_tasas.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyRofex
      - run: python3 scripts/save_tasas.py
        env:
          ROFEX_USER: ${{ secrets.ROFEX_USER }}
          ROFEX_PASS: ${{ secrets.ROFEX_PASS }}
          ROFEX_URL: ${{ secrets.ROFEX_URL }}
      - run: |
          git config user.name "cierre-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git commit -m "tasas de prueba" && git push
