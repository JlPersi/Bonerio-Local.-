name: "Acciones: foto de opciones"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  opciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/save_opciones.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cierre-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/acciones/opciones.json
            git commit -m "acciones: opciones $(date -u +%F)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
