name: Probar histórico Primary
on:
  push:
    branches: [claude/project-thread-9wlmpw]
    paths: [scripts/probar_historico.py, .github/workflows/probar_historico.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          ROFEX_USER: ${{ secrets.ROFEX_USER }}
          ROFEX_PASS: ${{ secrets.ROFEX_PASS }}
          ROFEX_URL: ${{ secrets.ROFEX_URL }}
        run: python3 scripts/probar_historico.py
